services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U studio"]
      interval: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD}@db/studio
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "alembic upgrade head && python -m backend.bootstrap"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD}@db/studio
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD}@db/studio
    command: [python, -m, backend.monitor]
    profiles: [jobs]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres:
